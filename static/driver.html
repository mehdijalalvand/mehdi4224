<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1976d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پیک">
<link rel="manifest" href="/manifest.json">
<title>ارسال موقعیت - پیک</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Tahoma, system-ui, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-height: 100vh;
  }
  .header {
    text-align: center;
    margin: 8px 0 4px;
  }
  .header h1 {
    font-size: 22px;
    margin: 0 0 8px;
    color: #fff;
  }
  .driver-name {
    display: inline-block;
    background: #1976d2;
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: bold;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 12px;
  }

  button {
    width: 100%;
    padding: 20px;
    font-size: 19px;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
    color: #fff;
  }
  button:active { transform: scale(0.97); }

  #startBtn { background: linear-gradient(135deg, #22c55e, #16a34a); }
  #stopBtn  { background: linear-gradient(135deg, #ef4444, #dc2626); }

  .status {
    margin-top: auto;
    padding: 20px;
    border-radius: 16px;
    background: #1e293b;
    font-size: 15px;
    line-height: 2;
    border: 1px solid #334155;
  }
  .status .row { display: flex; justify-content: space-between; }
  .status .val { color: #38bdf8; font-weight: bold; }

  .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #64748b;
    margin-left: 8px;
    vertical-align: middle;
  }
  .dot.on {
    background: #22c55e;
    box-shadow: 0 0 12px #22c55e;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  .badge {
    text-align: center;
    font-size: 12px;
    color: #64748b;
    padding-bottom: 12px;
  }

  .error-box {
    background: #7f1d1d;
    padding: 16px;
    border-radius: 12px;
    color: #fecaca;
    text-align: center;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="header">
    <h1>📍 ارسال موقعیت</h1>
    <div class="driver-name" id="driverName">...</div>
  </div>
  <div class="subtitle">این صفحه رو باز بذار تا موقعیتت به فروشگاه برسه</div>

  <button id="startBtn" style="display:none">▶ شروع ارسال</button>
  <button id="stopBtn" style="display:none">■ توقف</button>

  <div class="error-box" id="errorBox" style="display:none">
    ❌ لینک نامعتبر یا حذف شده
  </div>

  <div class="status" id="status" style="display:none">
    <div class="row">
      <span>وضعیت</span>
      <span><span class="dot" id="dot"></span><span id="stateText">آماده</span></span>
    </div>
    <div class="row"><span>دقت</span><span class="val" id="accText">-</span></div>
    <div class="row"><span>آخرین ارسال</span><span class="val" id="timeText">-</span></div>
    <div class="row"><span>تعداد ارسال</span><span class="val" id="countText">0</span></div>
  </div>

  <div class="badge">Delivery Tracker v2.0</div>

<script>
  const $ = (id) => document.getElementById(id);
  const startBtn  = $('startBtn');
  const stopBtn   = $('stopBtn');
  const driverNameEl = $('driverName');
  const dot       = $('dot');
  const stateText = $('stateText');
  const accText   = $('accText');
  const timeText  = $('timeText');
  const countText = $('countText');
  const errorBox  = $('errorBox');
  const statusEl  = $('status');

  let watchId = null;
  let lastSend = 0;
  let sendCount = 0;
  const SEND_INTERVAL = 4000;

  // توکن از آدرس گرفته می‌شه: /driver/AbC123xY
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const TOKEN = pathParts[1];  // بخش دوم

  if (!TOKEN) {
    errorBox.style.display = 'block';
  }

  function setState(text, on = false) {
    stateText.textContent = text;
    dot.classList.toggle('on', on);
  }

  // ۱) اطلاعات پیک رو از سرور بگیر
  async function loadDriver() {
    try {
      const res = await fetch('/api/positions');
      const all = await res.json();
      const me = all.find(d => d.token === TOKEN);
      if (!me) {
        errorBox.style.display = 'block';
        return false;
      }
      driverNameEl.textContent = me.name;
      document.title = 'پیک - ' + me.name;
      startBtn.style.display = 'block';
      statusEl.style.display = 'block';
      return true;
    } catch (e) {
      errorBox.style.display = 'block';
      return false;
    }
  }

  // ۲) ارسال موقعیت
  async function sendLocation(pos) {
    const now = Date.now();
    if (now - lastSend < SEND_INTERVAL) return;
    lastSend = now;

    const body = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      acc: Math.round(pos.coords.accuracy || 0),
      speed: pos.coords.speed != null ? Math.round(pos.coords.speed * 3.6) : null,
    };

    try {
      const res = await fetch('/api/location/' + TOKEN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('bad status');

      sendCount++;
      countText.textContent = sendCount;
      accText.textContent = body.acc + ' متر';
      timeText.textContent = new Date().toLocaleTimeString('fa-IR');
      setState('در حال ارسال', true);
    } catch (e) {
      setState('خطا در شبکه', false);
    }
  }

  function onError(err) {
    if (err.code === 1) {
      setState('دسترسی رد شد', false);
      alert('لطفاً به این صفحه اجازه‌ی دسترسی به موقعیت رو بده');
    } else if (err.code === 2) {
      setState('موقعیت در دسترس نیست', false);
    } else if (err.code === 3) {
      setState('زمان تمام شد', false);
    }
  }

  function start() {
    if (!navigator.geolocation) {
      alert('مرورگرت از موقعیت‌یابی پشتیبانی نمی‌کنه');
      return;
    }
    setState('در حال گرفتن موقعیت...', true);

    watchId = navigator.geolocation.watchPosition(
      sendLocation,
      onError,
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
    );

    startBtn.style.display = 'none';
    stopBtn.style.display = 'block';
  }

  function stop() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    setState('متوقف شد', false);
    startBtn.style.display = 'block';
    stopBtn.style.display = 'none';
  }

  startBtn.onclick = start;
  stopBtn.onclick = stop;

  // ثبت Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    });
  }

  // هشدار موقع بستن
  window.addEventListener('beforeunload', (e) => {
    if (watchId !== null) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // شروع
  if (TOKEN) loadDriver();
</script>
</body>
</html>
